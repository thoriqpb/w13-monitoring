<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>W13 | Monitoring Gerakan dan Jarak</title>

  <style>
    body {
      font: 16px Arial, sans-serif;
      margin: 0;
      background: #f3f7fa;
      color: #17364b;
    }

    main {
      max-width: 980px;
      margin: auto;
      padding: 20px;
    }

    header {
      background: #195d84;
      color: white;
      padding: 18px;
      border-radius: 10px;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
      margin-top: 16px;
    }

    .card {
      background: white;
      border: 1px solid #ccdce6;
      border-radius: 10px;
      padding: 12px;
    }

    h2 {
      font-size: 17px;
      margin: 0 0 8px;
    }

    iframe {
      width: 100%;
      height: 245px;
      border: 0;
    }

    small {
      color: #506b7b;
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>W13 - Monitoring Gerakan dan Jarak</h1>
      <div>ESP8266 | PIR | HC-SR04 | ThingSpeak</div>
    </header>

    <section class="grid">
      <div class="card">
        <h2>1. Jarak (cm)</h2>
        <iframe
          title="Jarak"
          loading="lazy"
          src="https://thingspeak.mathworks.com/channels/3580228/charts/1?dynamic=true">
        </iframe>
      </div>

      <div class="card">
        <h2>2. PIR (0/1)</h2>
        <iframe
          title="Gerakan"
          loading="lazy"
          src="https://thingspeak.mathworks.com/channels/3580228/charts/2?dynamic=true">
        </iframe>
      </div>

      <div class="card">
        <h2>3. Alarm (0/1)</h2>
        <iframe
          title="Alarm"
          loading="lazy"
          src="https://thingspeak.mathworks.com/channels/3580228/charts/3?dynamic=true">
        </iframe>
      </div>

      <div class="card">
        <h2>4. Kedekatan (%)</h2>
        <iframe
          title="Kedekatan"
          loading="lazy"
          src="https://thingspeak.mathworks.com/channels/3580228/charts/4?dynamic=true">
        </iframe>
      </div>

      <div class="card">
        <h2>5. Rentang valid (0/1)</h2>
        <iframe
          title="Validitas"
          loading="lazy"
          src="https://thingspeak.mathworks.com/channels/3580228/charts/5?dynamic=true">
        </iframe>
      </div>
    </section>

    <p>
      <small>
        Data demonstrasi baca-saja dari ThingSpeak.
        Halaman ini tidak menyimpan Write API Key.
      </small>
    </p>
  </main>
</body>
</html>
